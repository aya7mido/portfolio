<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>timer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faeee9;--motif:#f4c8be;--card:#fffaf7;--ink:#3d3733;--sub:#8a7a74;--line:#e2c8be;--salmon:#f1aa9e;--gray:#f2e6e0;--gtxt:#c2b2aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .6s}
:root.break{--bg:#e4eff7;--motif:#bddcf0;--card:#f6fafd;--ink:#34434f;--sub:#75889a;--line:#b8cfe1;--salmon:#9fcdec;--gray:#dbe7f0;--gtxt:#a9bbc9}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-family:"Jost","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:400;letter-spacing:.06em}
.deco{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.deco path{fill:none;stroke:var(--motif);stroke-width:36;stroke-linecap:round;stroke-linejoin:round;transition:stroke .6s}
.deco circle{fill:var(--motif);transition:fill .6s}
.wrap{max-width:540px;margin:0 auto;padding:26px 14px 30px}
h1{margin:0;padding:6px 6px 20px;font-family:"Jost",sans-serif;font-weight:300;font-size:clamp(34px,9vw,44px);letter-spacing:.42em;line-height:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 16px;margin-bottom:12px;transition:background .6s,border-color .6s}
.clock{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.cell+.cell{border-left:1px solid var(--line)}
.num{font-family:"Jost",sans-serif;font-weight:600;font-size:clamp(38px,11vw,60px);line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.unit{font-size:10px;margin-top:10px;color:var(--sub);letter-spacing:.2em}
.info{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);min-height:38px}
.info b{font-size:14px;font-weight:500;color:var(--ink)}
.done .num{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
h2{margin:0 0 12px;font-size:12px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;font-size:10px;color:var(--sub)}
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{border:1px solid var(--ink);border-radius:14px;padding:9px 4px 8px;text-align:center;line-height:1.3;transition:background .3s}
.sc b{display:block;font-size:17px;font-weight:500}
.sc small{font-size:10px;color:var(--sub)}
.sc.past{background:var(--gray);border-color:transparent;color:var(--gtxt)}.sc.past small{color:var(--gtxt)}
.sc.on{background:var(--salmon);border-color:var(--salmon)}.sc.on small{color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=time]{font-family:"Jost",sans-serif;font-weight:300;font-size:clamp(28px,8vw,38px);letter-spacing:.08em;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:4px 14px;width:100%;background:#fff;font-variant-numeric:tabular-nums;min-width:0}
input[type=time]:focus{outline:none;border-color:var(--salmon)}
.go{font:inherit;font-weight:500;font-size:14px;letter-spacing:.14em;background:var(--ink);color:var(--bg);border:none;border-radius:14px;padding:0 22px;cursor:pointer}
.go:hover{opacity:.85}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.chip{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:9px 4px;cursor:pointer;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--salmon);background:var(--salmon)}
#auto{width:100%;margin-top:8px}
.pvtab{position:absolute;right:24px;bottom:-12px;width:42px;height:12px;border:1px solid var(--line);border-top:none;padding:0;background:var(--gray);border-radius:0 0 10px 10px;cursor:pointer;transition:background .6s,border-color .6s}
.pvtab::after{content:"";position:absolute;inset:-2px -8px -8px}
.pvtab:focus-visible{outline:2px solid var(--salmon);outline-offset:2px}
</style>
</head>
<body>
<svg class="deco" id="deco" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<div class="wrap" id="app">
<h1>timer</h1>

<div class="panel">
  <div class="clock">
    <div class="cell"><div class="num" id="h">00</div><div class="unit">HOURS</div></div>
    <div class="cell"><div class="num" id="m">00</div><div class="unit">MINUTES</div></div>
    <div class="cell"><div class="num" id="s">00</div><div class="unit">SECONDS</div></div>
  </div>
  <div class="info"><span id="goal"></span><b id="status"></b></div>
</div>

<div class="panel">
  <h2>時間割 </h2>
  <div class="periods" id="periods"></div>
</div>

<div class="panel" style="position:relative">
  <h2>手動でセット</h2>
  <div class="row"><input type="time" id="at" aria-label="目標の時刻"><button class="go" id="go">START</button></div>
  <div class="quick" id="quick">
    <button class="chip" data-add="10">+10分</button>
    <button class="chip" data-add="50">+50分</button>
    <button class="chip" data-add="60">+1時間</button>
  </div>
  <button class="chip" id="auto" hidden>自動に戻す</button>
  <button class="pvtab" id="pv" aria-label="配色切り替え"></button>
</div>
</div>

<script>
const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,'0');
const PERIODS=[['1限','09:10','10:00'],['2限','10:10','11:00'],['3限','11:10','12:00'],['4限','12:50','13:40'],['5限','13:50','14:40'],['6限','14:50','15:40']];
const at=hm=>{const [h,m]=hm.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d.getTime()};
const hm=ms=>{const d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes())};
const hms=ms=>hm(ms)+':'+p2(new Date(ms).getSeconds());
let manual=null,forceBreak=false;
try{const d=JSON.parse(localStorage.getItem('countdown')||'null');if(d&&d.t>Date.now())manual=d.t}catch(e){}

$('periods').innerHTML=PERIODS.map(p=>`<div class="sc"><b>${p[0]}</b><small>${p[1]}–${p[2]}</small></div>`).join('');
const cards=[...document.querySelectorAll('.sc')];

function auto(now){
  const S=PERIODS.map(p=>[at(p[1]),at(p[2])]);
  for(let i=0;i<S.length;i++){
    if(now<S[i][1]){
      if(now>=S[i][0])return{i,brk:false,t:S[i][1],b:PERIODS[i][0]+' 授業中',g:hm(S[i][1])+' まで'};
      if(i===0)return{i:-1,brk:false,t:S[0][0],b:'授業前',g:'1限は '+PERIODS[0][1]+' から'};
      return{i:i-1,brk:true,t:S[i][0],b:(i===3?'昼休憩中':'休憩中'),g:PERIODS[i][0]+'は '+PERIODS[i][1]+' から'};
    }
  }
  return{i:6,brk:false,t:now,b:'本日の授業は終了',g:''};
}

/* background: tile the artwork (one copy = 2400 units) with 4 rotations so the repeat is not obvious */
const ART='<path d="M963.93,1960.94s47.29,216.46,274.67,225.56"/><path d="M343.18,1184.68s-123.69,147.34-176.44,178.26"/><path d="M1357.8,1543.52s-142.67-129.05-171.63-182.9"/><path d="M615.67,219.15s182.91,59.6,244.03,57.94"/><path d="M2160.45,2122.24s-191.2-21.24-250.71-7.21"/><path d="M1967.59,643.79s227.37,12.73,249.2,276.49"/><path d="M2143.02,1453.39s-12.73,227.37-276.49,249.2"/><path d="M1012.04,784.61s21.48,226.71-236.03,287.82"/><path d="M232.69,2069.81s82.32-212.33,339.92-151.65"/><path d="M1338.45,502.98s238.47,267.11,286.16,281.62"/><circle cx="604.94" cy="1600.05" r="22.06"/><circle cx="1563.41" cy="1876.27" r="22.06"/><circle cx="1866.53" cy="1162.62" r="22.06"/><circle cx="232.69" cy="353" r="22.06"/><circle cx="1953.81" cy="427.14" r="22.06"/><circle cx="1503.6" cy="248.14" r="22.06"/><circle cx="460.23" cy="759.98" r="22.06"/>';
function buildBg(){
  const svg=$('deco'),vw=innerWidth,vh=innerHeight;
  const T=Math.min(1150,Math.max(760,vw*0.58)),k=T/2400;
  const ox=(vw-2*T)/2,oy=(vh-2*T)/2,ROT=[[0,90],[270,180]];
  const i0=Math.floor(-ox/T),i1=Math.ceil((vw-ox)/T),j0=Math.floor(-oy/T),j1=Math.ceil((vh-oy)/T);
  let h='';
  for(let i=i0;i<i1;i++)for(let j=j0;j<j1;j++){
    const r=ROT[((j%2)+2)%2][((i%2)+2)%2];
    h+=`<g transform="translate(${(ox+i*T).toFixed(1)} ${(oy+j*T).toFixed(1)}) scale(${k.toFixed(5)}) rotate(${r} 1200 1200)">${ART}</g>`;
  }
  svg.innerHTML=h;
}
buildBg();
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(buildBg,120)});
function tick(){
  const now=Date.now();
  let t,b,g,brk=false,done=false,cur=-1;
  const a=auto(now);cur=a.i;
  const isManual=manual&&now<=manual+8000;
  if(isManual){t=manual;g='手動 '+hms(manual)+' まで';const r=Math.ceil((t-now)/1000);done=r<=0;b=done?'時間になりました！':''}
  else{if(manual){manual=null;try{localStorage.removeItem('countdown')}catch(e){}}t=a.t;b=a.b;g=a.g;brk=a.brk}
  const r=Math.max(0,Math.ceil((t-now)/1000));
  $('h').textContent=p2(Math.floor(r/3600));$('m').textContent=p2(Math.floor(r%3600/60));$('s').textContent=p2(r%60);
  $('goal').textContent=g;$('status').textContent=b;
  $('app').classList.toggle('done',done);
  document.documentElement.classList.toggle('break',forceBreak||(brk&&!isManual));
  $('auto').hidden=!isManual;
  cards.forEach((c,i)=>{const past=at(PERIODS[i][2])<=now;c.classList.toggle('past',past);c.classList.toggle('on',!past&&!a.brk&&a.i===i)});
}
function setManual(ms){manual=ms;try{localStorage.setItem('countdown',JSON.stringify({t:ms}))}catch(e){}tick()}
$('go').onclick=()=>{const v=$('at').value;if(!v){$('status').textContent='時刻を入力してください';return}
  const [h,m]=v.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);
  if(d.getTime()<=Date.now())d.setDate(d.getDate()+1);setManual(d.getTime())};
$('quick').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;
  const ms=Date.now()+b.dataset.add*60000;$('at').value=hm(ms);setManual(ms)};
$('pv').onclick=()=>{forceBreak=!forceBreak;tick()};
$('auto').onclick=()=>{manual=null;try{localStorage.removeItem('countdown')}catch(e){}tick()};
$('at').value=hm(manual||Date.now()+3600000);
tick();setInterval(tick,200);
</script>
<a href="../index.html#timer" class="pf-back" style="position:fixed;left:14px;bottom:14px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.88);color:#333;font:500 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.04em;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)">← portfolio</a>
<script>/* URLの末尾に ?shot を付けて開くと、スクショ用に「← portfolio」ボタンを隠す */if(/[?&]shot\b/.test(location.search)){var pfb=document.querySelector(".pf-back");if(pfb)pfb.style.display="none";}</script>
</body>
</html>
